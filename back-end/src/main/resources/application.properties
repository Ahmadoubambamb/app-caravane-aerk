spring.application.name=aerk
# Paramètres de connexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bus_reservation_db
spring.datasource.username=postgres
spring.datasource.password=mamekhady
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration Hibernate / JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Laisser ces variables vides désactive l'accès administrateur (échec fermé).
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.payment.mode=${PAYMENT_MODE:disabled}
app.payment.wave.api-key=${WAVE_API_KEY:}
app.payment.wave.success-url=${WAVE_SUCCESS_URL:http://localhost:4200/?payment=success&token={token}}
app.payment.wave.error-url=${WAVE_ERROR_URL:http://localhost:4200/?payment=error&token={token}}