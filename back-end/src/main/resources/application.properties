spring.application.name=aerk

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bus_reservation_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.payment.mode=${PAYMENT_MODE:disabled}
app.payment.wave.api-key=${WAVE_API_KEY:}
app.payment.wave.success-url=${WAVE_SUCCESS_URL:http://localhost:4200/?payment=success&token={token}}
app.payment.wave.error-url=${WAVE_ERROR_URL:http://localhost:4200/?payment=error&token={token}}
app.cors.allowed-origin-patterns=${FRONTEND_ORIGINS:http://localhost:4200}
server.port=${PORT:8080}
